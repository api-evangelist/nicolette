aid: nicolette
name: Nicolette
description: >-
  Nicolette, Inc. is a digital health company that empowers patients and families fighting acute
  health battles by democratizing electronic health record (EHR) data, curated education, and
  participation tools. Its flagship product, NicoBoard, is a hospital-provided bedside platform for
  parents of babies in the neonatal intensive care unit (NICU): it visualizes a baby's plan of care
  and clinical data, surfaces curated research and education, provides a care-team directory, and
  offers engagement, insights, and diary tools so parents can partner competently and confidently in
  their child's care. NicoBoard ships as iOS and Android apps distributed to families by hospitals.
  Founded in 2016 and backed by Techstars among others, Nicolette exposes no public developer API,
  documentation, or SDKs at this time.
